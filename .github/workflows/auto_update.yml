name: Auto Update Predictions

on:
  # Deux mises à jour automatiques par semaine.
  schedule:
    - cron: "0 8 * * 2"   # Mardi 08:00 UTC — intégration des résultats du week-end
    - cron: "0 14 * * 4"  # Jeudi 14:00 UTC — nouvelles cotes et affiches du week-end à venir
  # Déclenchement manuel en un clic depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-predictions:
    name: Update predictions cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Run update pipeline
        run: python backend/update_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"
          # Clé The Odds API, stockée dans Settings > Secrets and variables > Actions.
          # Si le secret est absent, le pipeline se rabat automatiquement sur fixtures.csv.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGIONS: eu
          ODDS_REFERENCE_BOOKMAKERS: pinnacle,bet365

      - name: Commit and push updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ne commit que le fichier de prédictions mis à jour (et les CSV bruts si modifiés).
          # Forcer l'ajout des fichiers générés (ignorés par .gitignore) avec -f
          git add -f data/upcoming_predictions.json data/fixtures.csv data/raw/*.csv || true
          if git diff --cached --quiet; then
            echo "Aucune modification à commiter."
            exit 0
          fi
          git commit -m "chore(auto): refresh upcoming predictions [skip ci]"
          git push
